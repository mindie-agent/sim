[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-sim"
version = "0.7.0"
description = "Ascend NPU 4-layer simulation, A3 predictive/normative performance modeling, calibration store, and boundary solvers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "numpy>=1.26"]

[project.scripts]
mindie-sim = "mindie_sim.__main__:main"

[tool.setuptools.packages.find]
include = ["mindie_sim*"]

[tool.setuptools.package-data]
mindie_sim = ["model_configs/*.json"]

[tool.pytest.ini_options]
markers = [
    "live_npu: standing A2/A3 Ascend NPU non-destructive live integration",
]
