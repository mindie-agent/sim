[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-sim"
version = "0.8.1"
description = "Hardware-neutral causal performance simulation, primitive calibration and independent validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ijson>=3.4,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "numpy>=1.26"]
profiling = ["mindie-profiler>=0.5.0"]

[project.scripts]
mindie-sim = "mindie_sim.__main__:main"

[tool.setuptools.packages.find]
include = ["mindie_sim*"]

[tool.setuptools.package-data]
mindie_sim = ["model_configs/*.json", "backends/profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_npu: standing A2/A3 Ascend NPU non-destructive live integration",
]
