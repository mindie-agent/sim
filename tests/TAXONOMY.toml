# Product-orthogonal test taxonomy (Vol 6 §2). Consumed by scripts/check_test_orthogonality.py.
# Every tests/<domain>/test_*.py must be listed here; `reserved = true` marks modules planned for a
# later shard (may be absent until `--strict`). max_modules is a hard ceiling (74 required + overflow).
schema_version = 1
domains = ["schema", "runtime", "collectives", "operators", "spine", "serving", "observations", "product", "hygiene"]
support_dirs = ["_support", "_oracles", "fixtures", "runtime/native"]
max_lines = 600
max_modules = 80

# ---------------------------------------------------------------- schema (hardware, datapath, catalog)
[[module]]
path = "schema/test_datapath.py"
tier = "tier0"
owns = ["mindie_sim/schema/datapath.py", "mindie_sim/schema/compute_arch.py"]

[[module]]
path = "schema/test_hardware_and_custom_skus.py"
tier = "tier0"
