# Product-orthogonal test taxonomy (Vol 6 §2). Consumed by scripts/check_test_orthogonality.py.
# Every tests/<domain>/test_*.py must be registered here with non-empty `owns = [...]`.
# `reserved = true` marks planned Stage-4 modules not yet materialized on disk.
schema_version = 1
domains = ["schema", "runtime", "collectives", "operators", "spine", "serving", "observations", "product", "hygiene"]
support_dirs = ["_support", "_oracles", "fixtures", "runtime/native"]
max_lines = 1500
