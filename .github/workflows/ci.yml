name: sim-ci

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    # The Windows/macOS legs run the full 7,270+ test suite under 4-worker xdist
    # slower than Linux; keep generous outer headroom above contended runners.
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - env:
          VIRTUAL_ENV: ${{ runner.temp }}/sim-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/sim-venv
        run: uv venv --seed "${{ runner.temp }}/sim-venv"
      - env:
          VIRTUAL_ENV: ${{ runner.temp }}/sim-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/sim-venv
        run: uv pip install ".[test]"
      - env:
          VIRTUAL_ENV: ${{ runner.temp }}/sim-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/sim-venv
        run: uv run --no-project python -c "import pathlib, shutil; [shutil.rmtree(p, ignore_errors=True) for p in [*pathlib.Path('.').glob('*.egg-info'), pathlib.Path('build'), pathlib.Path('dist'), pathlib.Path('.venv')]]"
      - name: Prebuild C accelerator once
        env:
          VIRTUAL_ENV: ${{ runner.temp }}/sim-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/sim-venv
          MINDIE_CACHE_HOME: ${{ runner.temp }}/mindie-sim-cache
        run: uv run --no-project python -B -c "import mindie_sim.prediction.runtime.accel_build as b; b.build_accel()"
      - env:
          VIRTUAL_ENV: ${{ runner.temp }}/sim-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/sim-venv
          MINDIE_CACHE_HOME: ${{ runner.temp }}/mindie-sim-cache
        run: uv run --no-project python -B -m pytest -q -n auto --dist worksteal -p no:cacheprovider --basetemp="${{ runner.temp }}/pt" -m "not live_npu" --durations=20 --junitxml="${{ runner.temp }}/results.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/results.xml

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: false
      - name: LF line endings
        run: python3 .github/scripts/check_lf_eol.py
      - name: Differential numeric literals
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 -B scripts/check_no_magic_numbers.py --base "$base" --root .

  catalog-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: false
      - env:
          VIRTUAL_ENV: ${{ runner.temp }}/sim-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/sim-venv
        run: uv venv --seed "${{ runner.temp }}/sim-venv"
      - env:
          VIRTUAL_ENV: ${{ runner.temp }}/sim-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/sim-venv
        run: uv pip install ".[test]"
      - name: Prebuild C accelerator once
        env:
          VIRTUAL_ENV: ${{ runner.temp }}/sim-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/sim-venv
          MINDIE_CACHE_HOME: ${{ runner.temp }}/mindie-sim-cache
        run: uv run --no-project python -B -c "import mindie_sim.prediction.runtime.accel_build as b; b.build_accel()"
      - name: Independent catalog conservation gate
        env:
          VIRTUAL_ENV: ${{ runner.temp }}/sim-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/sim-venv
          MINDIE_CACHE_HOME: ${{ runner.temp }}/mindie-sim-cache
        run: |
          uv run --no-project python -B scripts/verify_m1.py hygiene
          uv run --no-project python -B scripts/verify_m1.py catalog-meta --require-models 37

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: false
      - run: uv build
      - run: |
          uv venv /tmp/sim-wheel
          uv pip install --python /tmp/sim-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/sim-wheel/bin/python -c "from mindie_sim.backends.ascend import profiles; assert profiles(); import ijson"
          /tmp/sim-wheel/bin/mindie-sim --help

  release-ready:
    name: release-ready
    needs: [test, quality, wheel, catalog-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values()), "required CI failed or was skipped"'
