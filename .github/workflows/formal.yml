name: formal-lean4

on:
  push:
    branches: [main]
    paths:
      - "formal/**"
      - ".github/workflows/formal.yml"
  pull_request:
    paths:
      - "formal/**"
      - ".github/workflows/formal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean4-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ELAN_HOME: ${{ runner.temp }}/elan
    steps:
      - uses: actions/checkout@v4

      - name: Audit Lean sources for forbidden sorry, admit, or custom axiom tokens
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          def strip_lean_comments_and_strings(src: str) -> str:
              out, i, n, depth = [], 0, len(src), 0
              while i < n:
                  if depth == 0 and src[i] == '"':
                      i += 1
                      while i < n and src[i] != '"':
                          i += 2 if src[i] == '\\' else 1
                      i += 1
                      out.append('""')
                  elif src[i:i+2] == '/-':
                      depth += 1
                      i += 2
                  elif depth > 0 and src[i:i+2] == '-/':
                      depth -= 1
                      i += 2
                  elif depth == 0 and src[i:i+2] == '--':
                      while i < n and src[i] != '\n':
                          i += 1
                  else:
                      if depth == 0:
                          out.append(src[i])
                      elif src[i] == '\n':
                          out.append('\n')
                      i += 1
              if depth != 0:
                  raise ValueError("unclosed Lean block comment")
              return ''.join(out)

          lean_files = sorted(pathlib.Path("formal").rglob("*.lean"))
          assert lean_files, "no Lean files found under formal/"
          forbidden = re.compile(r"\b(?:sorry|sorryAx|admit|axiom)\b")
          errors = []
          for path in lean_files:
              cleaned = strip_lean_comments_and_strings(path.read_text(encoding="utf-8"))
              for match in forbidden.finditer(cleaned):
                  line = cleaned.count("\n", 0, match.start()) + 1
                  errors.append(f"{path}:{line}: forbidden token '{match.group(0)}'")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"Verified {len(lean_files)} Lean files: 0 sorry, 0 admit, 0 custom axiom.")
          PY

      - name: Install pinned Lean 4 toolchain via elan
        run: |
          TOOLCHAIN="$(tr -d '[:space:]' < formal/lean-toolchain)"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "${RUNNER_TEMP}/elan-init.sh"
          sh "${RUNNER_TEMP}/elan-init.sh" -y --no-modify-path --default-toolchain "${TOOLCHAIN}"
          echo "${ELAN_HOME}/bin" >> "${GITHUB_PATH}"

      - name: Machine-check MindIESimSpec and AxiomCheck
        working-directory: formal
        run: |
          lean --version
          lake --version
          lake build
