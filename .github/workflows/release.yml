name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read
  deployments: read

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@main
    secrets:
      MINDIE_RELEASE_DEPLOY_KEY: ${{ secrets.MINDIE_RELEASE_DEPLOY_KEY }}
    with:
      release-notes-path: docs/releases/sim-0.9.16.md
      python: /tmp/sim-rel-venv/bin/python
      setup-command: |
        uv venv --seed --python 3.13 /tmp/sim-rel-venv && uv pip install --python /tmp/sim-rel-venv/bin/python ".[test]" && rm -rf build dist *.egg-info .venv
      test-command: |
        PYTHONDONTWRITEBYTECODE=1 /tmp/sim-rel-venv/bin/python -B -m pytest -q -n auto -p no:cacheprovider -m "not live_npu"
